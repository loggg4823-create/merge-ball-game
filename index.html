<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合成大球</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
}
#game {
    position: relative;
    width: 400px;
    height: 640px;
    background: #14141e;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
}
canvas {
    display: block;
    width: 400px;
    height: 640px;
    cursor: pointer;
}
#ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 12px;
    pointer-events: none;
}
#timer {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #f0d050;
}
#timer.warning { color: #f05555; }
#score {
    font-size: 14px;
    color: #c0c0dd;
    position: absolute;
    top: 10px;
    left: 12px;
}
#info {
    font-size: 12px;
    color: #9090aa;
    position: absolute;
    top: 30px;
    left: 12px;
}
#deadline-label {
    position: absolute;
    right: 8px;
    font-size: 11px;
    color: #cc3333;
    pointer-events: none;
}
#gameover {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
}
#gameover.show { display: flex; }
#gameover h1 {
    font-size: 48px;
    color: #ff3333;
    margin-bottom: 10px;
}
#gameover .final-score {
    font-size: 28px;
    color: #f0d050;
    margin-bottom: 6px;
}
#gameover .hint {
    font-size: 16px;
    color: #b0b0c0;
    margin-top: 10px;
    cursor: pointer;
    padding: 10px 20px;
    border: 1px solid #555;
    border-radius: 6px;
}
#gameover .hint:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div id="game">
    <canvas id="canvas" width="400" height="640"></canvas>
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="info">Balls: 0</div>
        <div id="timer">02:00</div>
        <div id="deadline-label" style="top:98px">☠ DEADLINE</div>
    </div>
    <div id="gameover">
        <h1>GAME OVER</h1>
        <div class="final-score" id="final-score">Score: 0</div>
        <div class="hint" id="restart-btn">Click to Restart</div>
    </div>
</div>
<script>
// ===== CONFIG =====
const BALL_RADIUS = 10;
const GRAVITY = 0.3;
const TERMINAL_VELOCITY = 7;
const GROUND_FRICTION = 0.7;
const WALL_BOUNCE = 0.4;
const MERGE_SCALE = 1.35;
const GROUND_OFFSET = 20;
const DEADLINE_RATIO = 0.15;
const COUNTDOWN = 120;
const SPAWN_RATES = [0.65, 0.25, 0.10];
const W = 400, H = 640;
const GROUND_Y = H - GROUND_OFFSET;
const DEADLINE_Y = H * DEADLINE_RATIO;

const TIER_COLORS = [
    [160, 210, 255], [100, 200, 255], [60, 180, 255],
    [50, 210, 200], [60, 230, 140], [140, 240, 80],
    [220, 230, 60], [255, 190, 60], [255, 130, 80],
];
const LEVEL_NAMES = ["Lv1","Lv2","Lv3","Lv4","Lv5","Lv6","Lv7","Lv8","Lv9"];

function getTier(r) {
    if (r < BALL_RADIUS) return 0;
    let n = Math.log(r / BALL_RADIUS) / Math.log(MERGE_SCALE);
    return Math.min(Math.round(n), TIER_COLORS.length - 1);
}

// ===== CANVAS =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ===== GAME STATE =====
let balls = [];
let ripples = [];
let score = 0;
let timeLeft = COUNTDOWN;
let gameOver = false;
let gameStarted = false;
let lastTime = 0;

// ===== DOM REFS =====
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const infoEl = document.getElementById('info');
const gameoverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('final-score');

// ===== BALL CLASS =====
class Ball {
    constructor(x, y, radius, vx, vy) {
        this.x = x; this.y = y;
        this.vx = vx || 0; this.vy = vy || 0;
        this.radius = radius;
        this.mass = (radius * radius) / 3;
        this.tier = getTier(radius);
        this.color = TIER_COLORS[Math.min(this.tier, TIER_COLORS.length - 1)];
    }
    update() {
        this.vy += GRAVITY;
        if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;
        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.radius >= GROUND_Y) {
            this.y = GROUND_Y - this.radius;
            this.vy = 0;
            this.vx *= GROUND_FRICTION;
        }
        if (this.x - this.radius <= 0) {
            this.x = this.radius;
            this.vx = -this.vx * WALL_BOUNCE;
        } else if (this.x + this.radius >= W) {
            this.x = W - this.radius;
            this.vx = -this.vx * WALL_BOUNCE;
        }
        if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.vy = -this.vy * WALL_BOUNCE;
        }
        if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }
    draw() {
        const r = Math.round(this.radius);
        const [cr, cg, cb] = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // highlight
        ctx.beginPath();
        ctx.arc(this.x - r * 0.3, this.y - r * 0.3, Math.max(1, r / 3), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
    }
}

// ===== SPAWN RIPPLE =====
class Ripple {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.life = 20; this.maxLife = 20;
    }
    update() { this.life--; return this.life > 0; }
    draw() {
        const p = 1 - this.life / this.maxLife;
        const r = p * 50;
        const a = Math.round(180 * (1 - p));
        if (a <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${a/255})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

// ===== COLLISION =====
function resolveCollision(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minDist = a.radius + b.radius;
    if (dist >= minDist || dist === 0) return false;

    const nx = dx / dist, ny = dy / dist;
    const overlap = minDist - dist;

    if (a.tier === b.tier) {
        const nr = a.radius * MERGE_SCALE;
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const tm = a.mass + b.mass;
        const nvx = (a.vx * a.mass + b.vx * b.mass) / tm;
        const nvy = (a.vy * a.mass + b.vy * b.mass) / tm;
        const nt = getTier(nr);
        const bonus = Math.max(0, nt - 2) * 2;
        score += nt + bonus;

        const ai = balls.indexOf(a), bi = balls.indexOf(b);
        if (ai >= 0 && bi >= 0) {
            if (ai < bi) { balls.splice(bi, 1); balls.splice(ai, 1); }
            else { balls.splice(ai, 1); balls.splice(bi, 1); }
        }
        const nb = new Ball(mx, my, nr, nvx, nvy);
        balls.push(nb);
        return true;
    }

    const tm = a.mass + b.mass;
    const [up, lo] = a.y < b.y ? [a, b] : [b, a];
    const h = overlap * Math.abs(nx) * 1.1;
    if (h > 0.5) {
        if (up.x < lo.x) {
            up.x -= h * (lo.mass / tm);
            lo.x += h * (up.mass / tm);
        } else {
            up.x += h * (lo.mass / tm);
            lo.x -= h * (up.mass / tm);
        }
    } else if (Math.abs(nx) < 0.15 && overlap > 1) {
        const nudge = (0.5 + Math.random()) * (Math.random() < 0.5 ? 1 : -1);
        up.x += nudge;
    }
    up.y -= overlap * Math.max(0.3, Math.abs(ny)) * 1.1;
    return false;
}

// ===== GAME LOOP =====
function update(dt) {
    if (gameOver) return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; gameOver = true; showGameOver(); return; }

    for (const b of balls) b.update();

    for (let iter = 0; iter < 3; iter++) {
        let i = 0;
        while (i < balls.length) {
            let j = i + 1;
            while (j < balls.length) {
                const merged = resolveCollision(balls[i], balls[j]);
                if (merged) j = i + 1; else j++;
            }
            i++;
        }
    }

    for (const b of balls) {
        if (b.x - b.radius < 0) b.x = b.radius;
        else if (b.x + b.radius > W) b.x = W - b.radius;
        if (b.y - b.radius < 0) b.y = b.radius;
        if (b.y + b.radius > GROUND_Y) b.y = GROUND_Y - b.radius;
    }

    ripples = ripples.filter(r => r.update());
}

function draw() {
    ctx.fillStyle = '#14141e';
    ctx.fillRect(0, 0, W, H);

    // ground
    ctx.fillStyle = '#282838';
    ctx.fillRect(0, GROUND_Y, W, GROUND_OFFSET);
    ctx.strokeStyle = '#46465e';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();

    // balls
    for (const b of balls) b.draw();
    for (const r of ripples) r.draw();

    // deadline
    ctx.strokeStyle = '#dc2828';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, DEADLINE_Y); ctx.lineTo(W, DEADLINE_Y); ctx.stroke();

    // Update UI
    const m = Math.floor(timeLeft / 60);
    const s = Math.floor(timeLeft % 60);
    timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    timerEl.className = timeLeft > 30 ? '' : 'warning';
    scoreEl.textContent = `Score: ${score}`;
    let maxTier = 0;
    for (const b of balls) if (b.tier > maxTier) maxTier = b.tier;
    infoEl.textContent = `Balls: ${balls.length} | Max: ${LEVEL_NAMES[maxTier] || 'Lv1'}`;
}

function showGameOver() {
    gameoverEl.classList.add('show');
    finalScoreEl.textContent = `Score: ${score}`;
}

function restart() {
    balls = []; ripples = [];
    score = 0; timeLeft = COUNTDOWN;
    gameOver = false;
    gameoverEl.classList.remove('show');
}

// ===== INPUT =====
canvas.addEventListener('click', (e) => {
    if (gameOver) { restart(); return; }
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    if (my < DEADLINE_Y) {
        const rnd = Math.random();
        let st = 0;
        if (rnd >= SPAWN_RATES[0]) st = rnd < SPAWN_RATES[0] + SPAWN_RATES[1] ? 1 : 2;
        const r = BALL_RADIUS * Math.pow(MERGE_SCALE, st);
        balls.push(new Ball(mx, my, r, 0, 0));
        ripples.push(new Ripple(mx, my));
    }
});

document.getElementById('restart-btn').addEventListener('click', restart);

// ===== MAIN LOOP =====
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
